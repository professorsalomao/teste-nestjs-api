name: CI/CD - Deploy NestJS API to Amazon ECS

# ==================================================
# GATILHOS DA PIPELINE
# ==================================================

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

# ==================================================
# VARIAVEIS DE AMBIENTE
# ==================================================

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

jobs:
  # ==================================================
  # CI - CONTINUOUS INTEGRATION
  # ==================================================

  ci:
    name: Continuous Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporariamente permite erros de lint
      # durante a validacao da infraestrutura AWS.
      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        id: unit-tests
        run: npm test -- --ci --coverage --passWithNoTests

      - name: Build application
        run: npm run build

      - name: Upload coverage report
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  # ==================================================
  # CD - CONTINUOUS DEPLOYMENT
  # ==================================================

  deploy:
    name: Continuous Deployment

    needs: ci

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30

    concurrency:
      group: ecs-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ==================================================
      # VALIDAR CONFIGURACOES
      # ==================================================

      - name: Validate configuration
        env:
          AWS_ROLE_ARN: ${{ env.AWS_ROLE_ARN }}
        run: |
          for VAR in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_TASK_DEFINITION CONTAINER_NAME; do
            if [ -z "${!VAR}" ]; then
              echo "::error::Variable $VAR is not configured."
              exit 1
            fi
          done

          if [ ! -f "$ECS_TASK_DEFINITION" ]; then
            echo "::error::Task definition file not found."
            exit 1
          fi

          if [ ! -f Dockerfile ]; then
            echo "::error::Dockerfile not found."
            exit 1
          fi

          echo "Configuration validated successfully."

      # ==================================================
      # DIAGNOSTICO OIDC
      # ==================================================

      - name: Debug OIDC configuration
        shell: bash
        run: |
          node <<'EOF'
          (async () => {
            const url = new URL(
              process.env.ACTIONS_ID_TOKEN_REQUEST_URL
            );

            url.searchParams.set(
              'audience',
              'sts.amazonaws.com'
            );

            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
              }
            });

            if (!response.ok) {
              throw new Error(`OIDC request failed: ${response.status}`);
            }

            const { value } = await response.json();

            const claims = JSON.parse(
              Buffer.from(
                value.split('.')[1],
                'base64url'
              ).toString()
            );

            console.log(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              repository_id: claims.repository_id,
              repository_owner_id: claims.repository_owner_id,
              environment: claims.environment,
              ref: claims.ref
            }, null, 2));

          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          EOF

      # ==================================================
      # AUTENTICACAO AWS VIA OIDC
      # ==================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions
          retry-max-attempts: 3

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      # ==================================================
      # LOGIN NO AMAZON ECR
      # ==================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ==================================================
      # BUILD E PUBLICACAO DA IMAGEM DOCKER
      # ==================================================

      - name: Build, tag and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image..."
          echo "Image: $IMAGE"

          docker build -t "$IMAGE" .

          echo "Publishing Docker image..."

          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "Docker image published successfully."

      # ==================================================
      # ATUALIZAR TASK DEFINITION
      # ==================================================

      - name: Render ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # ==================================================
      # DEPLOY NO AMAZON ECS
      # ==================================================

      - name: Deploy to Amazon ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ==================================================
      # VALIDAR DEPLOY
      # ==================================================

      - name: Verify deployed task definition
        env:
          EXPECTED_TASK: ${{ steps.deploy-ecs.outputs.task-definition-arn }}
        run: |
          CURRENT_TASK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text)

          echo "Expected task: $EXPECTED_TASK"
          echo "Current task: $CURRENT_TASK"

          if [ -z "$EXPECTED_TASK" ] || [ "$CURRENT_TASK" != "$EXPECTED_TASK" ]; then
            echo "::error::Unexpected task definition."
            exit 1
          fi

          echo "Task definition successfully deployed."

      # ==================================================
      # RESUMO DA PUBLICACAO
      # ==================================================

      - name: Deployment summary
        env:
          DEPLOYED_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          echo "## Deployment successfully completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Configuration | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS Region | $AWS_REGION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECS Cluster | $ECS_CLUSTER |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECS Service | $ECS_SERVICE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container | $CONTAINER_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Image | $DEPLOYED_IMAGE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | $GITHUB_SHA |" >> "$GITHUB_STEP_SUMMARY"
