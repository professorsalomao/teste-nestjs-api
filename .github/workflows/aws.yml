
name: AWS CI/CD - NestJS

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================================
  # CI - CONTINUOUS INTEGRATION
  # ==========================================================

  ci:
    name: CI - Continuous Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      # Download do código-fonte
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Instalação das dependências
      - name: Install dependencies
        run: npm ci

      # Validação da qualidade do código
      - name: Run lint
        run: npm run lint
        continue-on-error: true

      # Execução dos testes automatizados
      - name: Run tests
        run: npm test -- --ci --coverage --passWithNoTests

      # Compilação da aplicação NestJS
      - name: Build application
        run: npm run build

      # Armazenamento do relatório de cobertura
      - name: Upload test coverage
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================
  # CD - CONTINUOUS DEPLOYMENT
  # ==========================================================

  deploy:
    name: CD - Deploy to Amazon ECS
    needs: ci

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment: production

    concurrency:
      group: ecs-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

    steps:

      # ======================================================
      # 1. DOWNLOAD DO CÓDIGO-FONTE
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ======================================================
      # 2. VALIDAÇÃO DAS CONFIGURAÇÕES
      # ======================================================

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_VARS=(
            AWS_REGION
            AWS_ROLE_ARN
            ECR_REPOSITORY
            ECS_CLUSTER
            ECS_SERVICE
            ECS_TASK_DEFINITION
            CONTAINER_NAME
          )

          for VARIABLE in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VARIABLE:-}" ]; then
              echo "::error::Missing configuration: $VARIABLE"
              exit 1
            fi
          done

          if [ ! -f "$ECS_TASK_DEFINITION" ]; then
            echo "::error::Task definition file not found"
            exit 1
          fi

          if [ ! -f "Dockerfile" ]; then
            echo "::error::Dockerfile not found"
            exit 1
          fi

          jq empty "$ECS_TASK_DEFINITION"

          echo "Configuration validated successfully."

      # ======================================================
      # 3. VALIDAÇÃO DO POSTGRESQL
      # ======================================================

      - name: Validate PostgreSQL configuration
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_ENV=(
            PORT
            POSTGRES_HOST
            POSTGRES_PORT
            POSTGRES_USER
            POSTGRES_DB
            DB_SSL_CA_PATH
            DB_SSL_REJECT_UNAUTHORIZED
            AWS_REGION
            AWS_S3_BUCKET
          )

          for VARIABLE in "${REQUIRED_ENV[@]}"; do

            if ! jq -e \
              --arg container "$CONTAINER_NAME" \
              --arg variable "$VARIABLE" \
              '
                any(
                  .containerDefinitions[];
                  .name == $container and
                  any(
                    .environment[]?;
                    .name == $variable and
                    ((.value // "") | length > 0)
                  )
                )
              ' "$ECS_TASK_DEFINITION" > /dev/null; then

              echo "::error::Missing environment variable: $VARIABLE"
              exit 1

            fi

          done

          DB_HOST=$(jq -r \
            --arg container "$CONTAINER_NAME" \
            '
              .containerDefinitions[]
              | select(.name == $container)
              | .environment[]
              | select(.name == "POSTGRES_HOST")
              | .value
            ' "$ECS_TASK_DEFINITION")

          case "$DB_HOST" in
            localhost|127.0.0.1|0.0.0.0|::1)
              echo "::error::POSTGRES_HOST cannot point to localhost"
              exit 1
              ;;
          esac

          if ! jq -e \
            --arg container "$CONTAINER_NAME" \
            '
              any(
                .containerDefinitions[];
                .name == $container and
                any(
                  .secrets[]?;
                  .name == "POSTGRES_PASS" and
                  ((.valueFrom // "") | length > 0)
                )
              )
            ' "$ECS_TASK_DEFINITION" > /dev/null; then

            echo "::error::POSTGRES_PASS secret is missing"
            exit 1

          fi

          if jq -e \
            --arg container "$CONTAINER_NAME" \
            '
              any(
                .containerDefinitions[];
                .name == $container and
                any(.environment[]?; .name == "POSTGRES_PASS")
              )
            ' "$ECS_TASK_DEFINITION" > /dev/null; then

            echo "::error::POSTGRES_PASS must not be stored as plain text"
            exit 1

          fi

          if [ ! -s "certs/global-bundle.pem" ]; then
            echo "::error::RDS SSL certificate not found"
            exit 1
          fi

          echo "PostgreSQL configuration validated successfully."

      # ======================================================
      # 4. AUTENTICAÇÃO NA AWS VIA OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions
          retry-max-attempts: 3

      # ======================================================
      # 5. VALIDAR AUTENTICAÇÃO AWS
      # ======================================================

      - name: Validate AWS identity
        run: aws sts get-caller-identity

      # ======================================================
      # 6. AUTENTICAÇÃO NO AMAZON ECR
      # ======================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ======================================================
      # 7. BUILD E PUBLICAÇÃO DA IMAGEM DOCKER
      # ======================================================

      - name: Build and push Docker image
        id: build-image
        shell: bash

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image..."

          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE" \
            .

          echo "Publishing Docker image to Amazon ECR..."

          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "Docker image published successfully."

      # ======================================================
      # 8. PREPARAR A NOVA TASK DEFINITION
      # ======================================================

      - name: Render Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # ======================================================
      # 9. REGISTRAR A REVISÃO E ATUALIZAR O SERVIÇO ECS
      # ======================================================

      - name: Deploy Amazon ECS task definition
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 20

      
      # ======================================================
      # 10. VALIDAR A REVISÃO IMPLANTADA
      # ======================================================

      - name: Verify deployed revision
        id: verify-deployment
        shell: bash

        env:
          EXPECTED_TASK_DEFINITION: ${{ steps.deploy-ecs.outputs.task-definition-arn }}

        run: |
          set -euo pipefail

          if [ -z "$EXPECTED_TASK_DEFINITION" ]; then
            echo "::error::Expected task definition ARN is missing"
            exit 1
          fi

          MAX_ATTEMPTS=40
          WAIT_SECONDS=15

          for ((ATTEMPT=1; ATTEMPT<=MAX_ATTEMPTS; ATTEMPT++)); do

            echo "Checking deployment: $ATTEMPT/$MAX_ATTEMPTS"

            SERVICE_INFO=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --output json)

            CURRENT_TASK_DEFINITION=$(echo "$SERVICE_INFO" | \
              jq -r '.services[0].taskDefinition // empty')

            RUNNING_COUNT=$(echo "$SERVICE_INFO" | \
              jq -r '.services[0].runningCount // 0')

            DESIRED_COUNT=$(echo "$SERVICE_INFO" | \
              jq -r '.services[0].desiredCount // 0')

            PENDING_COUNT=$(echo "$SERVICE_INFO" | \
              jq -r '.services[0].pendingCount // 0')

            ROLLOUT_STATE=$(echo "$SERVICE_INFO" | \
              jq -r '
                .services[0].deployments[]
                | select(.status == "PRIMARY")
                | .rolloutState // "UNKNOWN"
              ')

            echo "Expected task: $EXPECTED_TASK_DEFINITION"
            echo "Current task: $CURRENT_TASK_DEFINITION"
            echo "Rollout state: $ROLLOUT_STATE"
            echo "Running tasks: $RUNNING_COUNT"
            echo "Desired tasks: $DESIRED_COUNT"
            echo "Pending tasks: $PENDING_COUNT"

            if [ "$CURRENT_TASK_DEFINITION" != "$EXPECTED_TASK_DEFINITION" ]; then
              echo "::error::Unexpected task definition. Possible rollback."
              exit 1
            fi

            if [ "$ROLLOUT_STATE" = "FAILED" ]; then
              echo "::error::ECS deployment failed"
              exit 1
            fi

            if [ "$ROLLOUT_STATE" = "COMPLETED" ] && \
               [ "$RUNNING_COUNT" -eq "$DESIRED_COUNT" ] && \
               [ "$RUNNING_COUNT" -gt 0 ] && \
               [ "$PENDING_COUNT" -eq 0 ]; then

              echo "task_definition=$CURRENT_TASK_DEFINITION" >> "$GITHUB_OUTPUT"
              echo "running_count=$RUNNING_COUNT" >> "$GITHUB_OUTPUT"
              echo "rollout_state=$ROLLOUT_STATE" >> "$GITHUB_OUTPUT"

              echo "Deployment validated successfully."
              exit 0

            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting ${WAIT_SECONDS} seconds..."
              sleep "$WAIT_SECONDS"
            fi

          done

          echo "::error::Timeout waiting for ECS deployment"

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].events[0:10]' \
            --output table

          exit 1"

      # ======================================================
      # 11. GERAR RESUMO DA IMPLANTAÇÃO
      # ======================================================

      - name: Deployment summary
        if: always()
        shell: bash

        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          TASK_DEFINITION_ARN: ${{ steps.verify-deployment.outputs.task_definition }}
          RUNNING_COUNT: ${{ steps.verify-deployment.outputs.running_count }}

        run: |
          {
            echo "## AWS CI/CD - NestJS"
            echo ""
            echo "| Configuration | Value |"
            echo "| --- | --- |"
            echo "| Status | $JOB_STATUS |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Region | $AWS_REGION |"
            echo "| ECR Repository | $ECR_REPOSITORY |"
            echo "| ECS Cluster | $ECS_CLUSTER |"
            echo "| ECS Service | $ECS_SERVICE |"
            echo "| Docker Image | ${IMAGE_URI:-Not published} |"
            echo "| Task Definition | ${TASK_DEFINITION_ARN:-Not validated} |"
            echo "| Running Tasks | ${RUNNING_COUNT:-Not validated} |"
            echo "| Environment | production |"
            echo ""

            if [ "$JOB_STATUS" = "success" ]; then
              echo "### Deployment completed successfully."
            else
              echo "### Deployment failed."
              echo "Check the GitHub Actions and Amazon CloudWatch logs."
            fi

          } >> "$GITHUB_STEP_SUMMARY"
